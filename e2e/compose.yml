# The five services e2e wants, with the accounts, passwords and database names matching the
# defaults in scripts/e2e.sh / e2e/harness.
#
#   docker compose -f e2e/compose.yml up -d --wait   # bring them up and wait until they are healthy
#   scripts/e2e.sh
#   docker compose -f e2e/compose.yml down           # nothing is on disk, down and it is gone
#
# When a default port is taken on this host (by the system's own PostgreSQL, say), pick another one
# and tell e2e.sh through the same set of variables:
#
#   XONE_E2E_PG_PORT=15432 docker compose -f e2e/compose.yml up -d --wait
#   XONE_E2E_PG_ADDR=127.0.0.1:15432 scripts/e2e.sh
#
# The images come from mirror.gcr.io (Docker Hub's public image cache, with identical content) so
# that Docker Hub's pull limit is never hit; CI's e2e workflow uses the same set of images.
name: xone-e2e

services:
  postgres:
    image: mirror.gcr.io/library/postgres:16
    environment:
      POSTGRES_USER: xone
      POSTGRES_PASSWORD: e2e-secret-pw
      POSTGRES_DB: xone_e2e
    ports: ["127.0.0.1:${XONE_E2E_PG_PORT:-5432}:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "xone", "-d", "xone_e2e"]
      interval: 2s
      retries: 30

  mysql:
    image: mirror.gcr.io/library/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: e2e-root-pw
      MYSQL_USER: xone
      MYSQL_PASSWORD: e2e-secret-pw
      MYSQL_DATABASE: xone_e2e
    ports: ["127.0.0.1:${XONE_E2E_MYSQL_PORT:-3306}:3306"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      # The temporary instance that runs during initialization opens no TCP: a connection to
      # 127.0.0.1 is what tells it has really come up
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uxone", "-pe2e-secret-pw"]
      interval: 2s
      retries: 60

  redis:
    image: mirror.gcr.io/library/redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:${XONE_E2E_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  clickhouse:
    image: mirror.gcr.io/clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: xone
      CLICKHOUSE_PASSWORD: e2e-secret-pw
      CLICKHOUSE_DB: xone_e2e
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${XONE_E2E_CH_PORT:-9000}:9000"
      - "127.0.0.1:${XONE_E2E_CH_HTTP_PORT:-8123}:8123"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 2s
      retries: 60

  # One KRaft node. The apache/kafka image drops its own default configuration as soon as any
  # KAFKA_ environment variable is given, so the whole set has to be written out.
  # GROUP_INITIAL_REBALANCE_DELAY_MS defaults to 3000, which makes every new consumer group wait 3s
  # for its first assignment; every e2e case joins a group, so it is turned off
  kafka:
    image: mirror.gcr.io/apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:${XONE_E2E_KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports: ["127.0.0.1:${XONE_E2E_KAFKA_PORT:-9092}:9092"]
    tmpfs: [/tmp/kraft-combined-logs]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "127.0.0.1:9092"]
      interval: 3s
      retries: 40
