# The e2e service's configuration. The connection strings, addresses, ports and table names that
# differ per process are written as ${VAR} and injected by the harness:
#   E2E_PORT               XGin.Port (required)
#   E2E_PG_DSN             XGorm.Clients.default.DSN (required, PostgreSQL)
#   E2E_MYSQL_DSN          XGorm.Clients.mysql.DSN (required, MySQL)
#   E2E_REDIS_ADDR         XRedis.Addr (required)
#   E2E_TABLE              Service.Table; the order table is this plus _orders
#   E2E_KEY_PREFIX         Service.KeyPrefix
#   E2E_DOWNSTREAM_URL     Service.Downstream, the downstream /proxy calls
#   E2E_SPAN_FILE          Service.SpanFile; empty writes no spans
#   E2E_LOG_FILE           XLog.File.Enable, with the directory in E2E_LOG_DIR
#   E2E_CH_DSN             the third instance ch (ClickHouse), which lives in application-ch.yml and needs --profile=ch
#
# The switches do not go through the environment: a case lays a profile over this with
# harness.Options.Overlay, which is the YAML a caller would write.
# What is not written here is the framework's default -- a case testing the default behavior meets
# the real default and not one this file pinned for it.

XApp:
  Name: xone.e2e.service
  Version: e2e

XLog:
  Format: json
  File:
    Enable: ${E2E_LOG_FILE:false}
    Path: ${E2E_LOG_DIR:}      # empty keeps the default; it is only used with Enable
    Name: app.log

XTrace:
  ForwardHeaders:          # values are taken from the peers in XGin.TrustedProxies alone, which trusts the private ranges by default
    - X-Request-Id

XMetric:
  Namespace: e2e

# Two instances: default is PG (what C() returns) and mysql is MySQL (C("mysql"));
# the third, ch (ClickHouse), lives in application-ch.yml and is laid over with --profile=ch.
# Each instance is configured on its own, and an overlay changes one field with
# XGorm.Clients.<name>.<field>
XGorm:
  Clients:
    default:
      Driver: postgres
      DSN: "${E2E_PG_DSN}"
    mysql:
      Driver: mysql
      DSN: "${E2E_MYSQL_DSN}"

XRedis:
  Addr: "${E2E_REDIS_ADDR}"

XCache:
  NumCounters: 100000
  MaxCost: 10000
  DefaultTTL: 30s

XHttp:
  Timeout: 5s

XFlow:
  RollbackTimeout: 5s

XGin:
  Host: 127.0.0.1
  Port: ${E2E_PORT}

Service:
  Table: "${E2E_TABLE:e2e_users}"
  KeyPrefix: "${E2E_KEY_PREFIX:e2e:}"
  Downstream: "${E2E_DOWNSTREAM_URL:}"
  SpanFile: "${E2E_SPAN_FILE:}"
  UserTTL: 60s
