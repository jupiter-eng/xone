# Kafka: a profile variant of application.yml, laid over with --profile=kafka.
# The harness activates it with Options.Kafka; the processes of the other cases have no XKafka and
# answer 503 to every /kafka/....
#
#   E2E_KAFKA_ADDR   XKafka.Brokers (required once activated)
#   E2E_KAFKA_TOPIC  Service.KafkaTopic: non-empty, it is consumed (see kafka.go)
#   E2E_KAFKA_GROUP  Service.KafkaGroup: the consumer group
#
# Every other setting is xkafka's default.

XKafka:
  Brokers: ["${E2E_KAFKA_ADDR}"]

Service:
  KafkaTopic: "${E2E_KAFKA_TOPIC:}"
  KafkaGroup: "${E2E_KAFKA_GROUP:}"
