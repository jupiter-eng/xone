# The ClickHouse instance ch: a profile variant of application.yml, laid over with --profile=ch.
# The harness activates it with Options.ClickHouse (together with a test's own overlay that is
# --profile=ch,e2e, where the overlay comes last and wins). The processes of the other cases have
# no such instance and answer 503 to every /ch/... -- which is what lets the other e2e cases run on
# a machine with no ClickHouse.
#
#   E2E_CH_DSN       XGorm.Clients.ch.DSN (required once activated), clickhouse://user:pass@host:9000/db
#
# Every other setting is xgorm's default: DialTimeout 500ms injected into the DSN as dial_timeout,
# no read_timeout injected (the driver's default being 300s), and a 50 / 50 / 5m / 5m pool.

XGorm:
  Clients:
    ch:
      Driver: clickhouse
      DSN: "${E2E_CH_DSN}"
