<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 964" width="1180" height="964" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <title>xone module architecture</title>
  <style>
