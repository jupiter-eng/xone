  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead-amber"/></marker>
  </defs>
  <rect width="1180" height="964" class="bg"/>
  <text x="32" y="44" font-size="25" font-weight="700" class="title">xone module architecture</text>
  <text x="32" y="68" font-size="13" class="sub">A Go framework for integrating third-party libraries —— layered dependencies, startup / shutdown order</text>
  <line x1="20" y1="100" x2="20" y2="736" class="axis" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="14" y="422" font-size="11" text-anchor="middle" transform="rotate(-90 14 422)" class="axis-t">Dependency direction: upper → lower</text>
  <rect x="32" y="92" width="756" height="92" rx="8" class="app-band"/>
  <text x="46" y="116" font-size="11" font-weight="700" letter-spacing=".5" class="app-lb">APPLICATION</text>
  <text x="46" y="134" font-size="13" font-weight="600" class="app-t">Your code</text>
  <rect x="152.0" y="107" width="624.0" height="62" rx="6" class="app-card" stroke-dasharray="4 3"/>
  <text x="464.0" y="132" font-size="14" font-weight="700" text-anchor="middle" class="app-t mono">xone.MustRun(xgin.New().WithRoutes(routes))</text>
  <text x="464.0" y="153" font-size="11" text-anchor="middle" class="app-m mono">xconfig.Unmarshal · xhook.BeforeStart · xgorm.CWithCtx(ctx) · slog.InfoContext(ctx, …)</text>
  <rect x="32" y="196" width="756" height="92" rx="8" class="srv-band"/>
  <text x="46" y="220" font-size="11" font-weight="700" letter-spacing=".5" class="srv-lb">SERVER</text>
  <text x="46" y="238" font-size="11.5" class="srv-m">StageServer</text>
  <rect x="152.0" y="211" width="200.0" height="62" rx="6" class="srv-card"/>
  <text x="252.0" y="237" font-size="14" font-weight="700" text-anchor="middle" class="srv-t">xgin</text>
  <text x="252.0" y="256" font-size="10.5" text-anchor="middle" class="srv-m">*gin.Engine · logs · traces · metrics</text>
  <rect x="364.0" y="211" width="200.0" height="62" rx="6" class="srv-card"/>
  <text x="464.0" y="237" font-size="14" font-weight="700" text-anchor="middle" class="srv-t">xecho</text>
  <text x="464.0" y="256" font-size="10.5" text-anchor="middle" class="srv-m">*echo.Echo · same behavior as xgin</text>
  <rect x="576.0" y="211" width="200.0" height="62" rx="6" class="srv-card"/>
  <text x="676.0" y="237" font-size="14" font-weight="700" text-anchor="middle" class="srv-t">xginswagger</text>
  <text x="676.0" y="256" font-size="10.5" text-anchor="middle" class="srv-m">Swagger UI (xgin)</text>
  <rect x="32" y="300" width="756" height="164" rx="8" class="cli-band"/>
  <text x="46" y="324" font-size="11" font-weight="700" letter-spacing=".5" class="cli-lb">CLIENT</text>
  <text x="46" y="342" font-size="11.5" class="cli-m">StageClient</text>
  <rect x="152.0" y="315" width="200.0" height="62" rx="6" class="cli-card"/>
  <text x="252.0" y="341" font-size="14" font-weight="700" text-anchor="middle" class="cli-t">xgorm</text>
  <text x="252.0" y="360" font-size="10.5" text-anchor="middle" class="cli-m">*gorm.DB · MySQL / PostgreSQL</text>
  <rect x="364.0" y="315" width="200.0" height="62" rx="6" class="cli-card"/>
  <text x="464.0" y="341" font-size="13" font-weight="700" text-anchor="middle" class="cli-t">xgorm/clickhouse</text>
  <text x="464.0" y="360" font-size="10.5" text-anchor="middle" class="cli-m">ClickHouse driver</text>
  <rect x="576.0" y="315" width="200.0" height="62" rx="6" class="cli-card"/>
  <text x="676.0" y="341" font-size="14" font-weight="700" text-anchor="middle" class="cli-t">xredis</text>
  <text x="676.0" y="360" font-size="10.5" text-anchor="middle" class="cli-m">*redis.Client · several instances</text>
  <rect x="152.0" y="387" width="200.0" height="62" rx="6" class="cli-card"/>
  <text x="252.0" y="413" font-size="14" font-weight="700" text-anchor="middle" class="cli-t">xcache</text>
  <text x="252.0" y="432" font-size="10.5" text-anchor="middle" class="cli-m">ristretto · local cache</text>
  <rect x="364.0" y="387" width="200.0" height="62" rx="6" class="cli-card"/>
  <text x="464.0" y="413" font-size="14" font-weight="700" text-anchor="middle" class="cli-t">xhttp</text>
  <text x="464.0" y="432" font-size="10.5" text-anchor="middle" class="cli-m">*resty.Client · retries · metrics</text>
  <rect x="576.0" y="387" width="200.0" height="62" rx="6" class="cli-card" stroke-dasharray="4 3"/>
  <text x="676.0" y="413" font-size="14" font-weight="700" text-anchor="middle" class="cli-t">Your integration</text>
  <text x="676.0" y="432" font-size="10.5" text-anchor="middle" class="cli-m">xhook + xconfig is all it takes</text>
  <rect x="32" y="476" width="756" height="92" rx="8" class="tel-band"/>
  <text x="46" y="500" font-size="11" font-weight="700" letter-spacing=".5" class="tel-lb">TELEMETRY</text>
  <text x="46" y="518" font-size="11.5" class="tel-m">StageTelemetry</text>
  <rect x="152.0" y="491" width="306.0" height="62" rx="6" class="tel-card"/>
  <text x="305.0" y="517" font-size="14" font-weight="700" text-anchor="middle" class="tel-t">xtrace</text>
  <text x="305.0" y="536" font-size="10.5" text-anchor="middle" class="tel-m">OpenTelemetry · global TracerProvider</text>
  <rect x="470.0" y="491" width="306.0" height="62" rx="6" class="tel-card"/>
  <text x="623.0" y="517" font-size="14" font-weight="700" text-anchor="middle" class="tel-t">xmetric</text>
  <text x="623.0" y="536" font-size="10.5" text-anchor="middle" class="tel-m">Prometheus · /metrics</text>
  <rect x="32" y="580" width="756" height="164" rx="8" class="core-band"/>
  <text x="46" y="604" font-size="11" font-weight="700" letter-spacing=".5" class="core-lb">CORE</text>
  <text x="46" y="622" font-size="13" font-weight="600" class="core-t">Core modules</text>
  <text x="46" y="640" font-size="10.5" class="ok">yaml only</text>
  <rect x="152.0" y="595" width="147.0" height="62" rx="6" class="core-card"/>
  <text x="225.5" y="621" font-size="14" font-weight="700" text-anchor="middle" class="core-t">xone.Run</text>
  <text x="225.5" y="640" font-size="10.5" text-anchor="middle" class="core-m">staged start · reverse stop</text>
  <rect x="311.0" y="595" width="147.0" height="62" rx="6" class="core-card"/>
  <text x="384.5" y="621" font-size="14" font-weight="700" text-anchor="middle" class="core-t">xconfig</text>
  <text x="384.5" y="640" font-size="10.5" text-anchor="middle" class="core-m">lazy load · strict decode</text>
  <rect x="470.0" y="595" width="147.0" height="62" rx="6" class="core-card"/>
  <text x="543.5" y="621" font-size="14" font-weight="700" text-anchor="middle" class="core-t">xhook</text>
  <text x="543.5" y="640" font-size="10.5" text-anchor="middle" class="core-m">BeforeStart / BeforeStop</text>
  <rect x="629.0" y="595" width="147.0" height="62" rx="6" class="core-card"/>
  <text x="702.5" y="621" font-size="14" font-weight="700" text-anchor="middle" class="core-t">xlog</text>
  <text x="702.5" y="640" font-size="10.5" text-anchor="middle" class="core-m">slog · with xgin / xecho</text>
  <rect x="152.0" y="667" width="147.0" height="62" rx="6" class="core-card"/>
  <text x="225.5" y="693" font-size="14" font-weight="700" text-anchor="middle" class="core-t">xflow</text>
  <text x="225.5" y="712" font-size="10.5" text-anchor="middle" class="core-m">orchestration · rollback</text>
  <rect x="311.0" y="667" width="147.0" height="62" rx="6" class="core-card"/>
  <text x="384.5" y="693" font-size="14" font-weight="700" text-anchor="middle" class="core-t">xerror</text>
  <text x="384.5" y="712" font-size="10.5" text-anchor="middle" class="core-m">module name · op name</text>
  <rect x="470.0" y="667" width="147.0" height="62" rx="6" class="core-card"/>
  <text x="543.5" y="693" font-size="14" font-weight="700" text-anchor="middle" class="core-t">xapp · xtls</text>
  <text x="543.5" y="712" font-size="10.5" text-anchor="middle" class="core-m">app identity · client TLS</text>
  <rect x="629.0" y="667" width="147.0" height="62" rx="6" class="core-card"/>
  <text x="702.5" y="693" font-size="14" font-weight="700" text-anchor="middle" class="core-t">xonetest</text>
  <text x="702.5" y="712" font-size="10.5" text-anchor="middle" class="core-m">swap config in tests</text>
  <rect x="812" y="92" width="336" height="652" rx="8" class="lc-panel"/>
  <text x="832" y="118" font-size="13" font-weight="700" class="lc-t">Startup and shutdown</text>
  <text x="832" y="137" font-size="10.5" class="lc-m">init() only registers; xone.Run runs the stages in order</text>
  <text x="832" y="152" font-size="10.5" class="lc-m">Order within one stage is not to be relied on</text>
  <rect x="832" y="168" width="296" height="30" rx="5" class="lc-pre"/>
  <text x="844" y="187.5" font-size="12" font-weight="700" class="lc-pre-t">Signals</text>
  <text x="1116" y="187.5" font-size="10.5" text-anchor="end" class="lc-pre-m">SIGINT · SIGTERM, before config is read</text>
  <line x1="980" y1="198" x2="980" y2="208" class="lc-arrow" marker-end="url(#arrowAmber)"/>
  <rect x="832" y="208" width="296" height="30" rx="5" class="lc-pre"/>
  <text x="844" y="227.5" font-size="12" font-weight="700" class="lc-pre-t">Config</text>
  <text x="1116" y="227.5" font-size="10.5" text-anchor="end" class="lc-pre-m">a typo or an unset ${VAR} is an error</text>
  <line x1="980" y1="238" x2="980" y2="248" class="lc-arrow" marker-end="url(#arrowAmber)"/>
  <rect x="832" y="248" width="296" height="30" rx="5" class="lc-st"/>
  <text x="844" y="267.5" font-size="12" font-weight="700" class="lc-st-t">Log</text>
  <text x="1116" y="267.5" font-size="10.5" text-anchor="end" class="lc-st-m">xlog · xapp · xflow</text>
  <line x1="980" y1="278" x2="980" y2="288" class="lc-arrow" marker-end="url(#arrowAmber)"/>
  <rect x="832" y="288" width="296" height="30" rx="5" class="lc-st"/>
  <text x="844" y="307.5" font-size="12" font-weight="700" class="lc-st-t">Telemetry</text>
  <text x="1116" y="307.5" font-size="10.5" text-anchor="end" class="lc-st-m">xtrace · xmetric</text>
  <line x1="980" y1="318" x2="980" y2="328" class="lc-arrow" marker-end="url(#arrowAmber)"/>
  <rect x="832" y="328" width="296" height="30" rx="5" class="lc-st"/>
  <text x="844" y="347.5" font-size="12" font-weight="700" class="lc-st-t">Client</text>
  <text x="1116" y="347.5" font-size="10.5" text-anchor="end" class="lc-st-m">xgorm · xredis · xcache · xhttp</text>
  <line x1="980" y1="358" x2="980" y2="368" class="lc-arrow" marker-end="url(#arrowAmber)"/>
  <rect x="832" y="368" width="296" height="30" rx="5" class="lc-st"/>
  <text x="844" y="387.5" font-size="12" font-weight="700" class="lc-st-t">Business</text>
  <text x="1116" y="387.5" font-size="10.5" text-anchor="end" class="lc-st-m">your hooks (no stage written = here)</text>
  <line x1="980" y1="398" x2="980" y2="408" class="lc-arrow" marker-end="url(#arrowAmber)"/>
  <rect x="832" y="408" width="296" height="30" rx="5" class="lc-st"/>
  <text x="844" y="427.5" font-size="12" font-weight="700" class="lc-st-t">Server</text>
  <text x="1116" y="427.5" font-size="10.5" text-anchor="end" class="lc-st-m">xgin · xecho · xginswagger</text>
  <line x1="980" y1="438" x2="980" y2="448" class="lc-arrow" marker-end="url(#arrowAmber)"/>
  <rect x="832" y="448" width="296" height="30" rx="5" class="lc-run"/>
  <text x="844" y="467.5" font-size="12" font-weight="700" class="lc-run-t">Runnable.Start</text>
  <text x="1116" y="467.5" font-size="10.5" text-anchor="end" class="lc-run-m">starts taking requests</text>
  <rect x="832" y="492" width="296" height="81" rx="5" class="lc-mirror"/>
  <text x="844" y="512" font-size="12" font-weight="700" class="lc-mirror-t">Shutdown = startup mirrored</text>
  <text x="844" y="531" font-size="10.5" class="lc-mirror-m">signal → cancel Start’s ctx → Runnable cleans up</text>
  <text x="844" y="548" font-size="10.5" class="lc-mirror-m">stop hooks in reverse: Server → … → Log, xlog last</text>
  <text x="844" y="565" font-size="10.5" class="lc-mirror-m">a second signal kills a stuck process outright</text>
  <rect x="832" y="583" width="296" height="64" rx="5" class="lc-note"/>
  <text x="844" y="603" font-size="12" font-weight="700" class="lc-note-t">Automatic rollback on a failed start</text>
  <text x="844" y="622" font-size="10.5" class="lc-note-m">if a start hook fails, what is up closes in reverse</text>
  <text x="844" y="639" font-size="10.5" class="lc-note-m">a stop hook runs only if its start hook succeeded</text>
  <rect x="832" y="657" width="296" height="64" rx="5" class="lc-note"/>
  <text x="844" y="677" font-size="12" font-weight="700" class="lc-note-t">One stop budget</text>
  <text x="844" y="696" font-size="10.5" class="lc-note-m">xone.WithStopTimeout, 15s by default</text>
  <text x="844" y="713" font-size="10.5" class="lc-note-m">shared by the whole shutdown; servers take at most 2/3</text>
  <rect x="32" y="760" width="1116" height="100" rx="8" class="note"/>
  <text x="48" y="784" font-size="13" font-weight="700" class="note-t">Between the modules</text>
  <circle cx="54" cy="802" r="3" class="dot"/>
  <text x="66" y="806" font-size="11.5" class="note-m">Every integration with a third-party dependency is <tspan font-weight="700">its own Go module</tspan>: it enters your module graph only when imported, and an unused one brings nothing.</text>
  <circle cx="54" cy="824" r="3" class="dot"/>
  <text x="66" y="828" font-size="11.5" class="note-m"><tspan font-weight="700">Metrics and traces come with the integrations</tspan>: xgin / xecho / xgorm / xredis / xhttp bring xtrace and xmetric, xcache brings xmetric; <tspan font-weight="700">xlog comes only with xgin / xecho</tspan>.</text>
  <circle cx="54" cy="846" r="3" class="dot"/>
  <text x="66" y="850" font-size="11.5" class="note-m">An integration registers through <tspan font-weight="700">xhook</tspan> and reads config through <tspan font-weight="700">xconfig</tspan>, never importing the root package; each exports a pure <tspan font-weight="700">New</tspan> usable outside the framework.</text>
  <rect x="32" y="872" width="1116" height="72" rx="8" class="green"/>
  <text x="48" y="895" font-size="12.5" font-weight="700" class="green-t">What you get is the native client</text>
  <text x="48" y="915" font-size="11.5" class="green-m">*gorm.DB, *redis.Client, *gin.Engine, *echo.Echo, *resty.Client, the standard library’s slog, OpenTelemetry, Prometheus —— no new API to learn; the libraries’ own docs still apply.</text>
  <text x="48" y="933" font-size="11.5" class="green-m">The framework only reads the config, builds by stage and closes in reverse on exit; every library’s defaults were measured and the unsafe ones changed (see docs/behavior.md).</text>
</svg>
