<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" width="1180" height="650" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <title>xone startup and shutdown</title>
  <style>
    .bg{fill:#fff} .title{fill:#1e293b} .sub{fill:#64748b} .edge{stroke:#94a3b8;stroke-width:1.5} .arrowhead{fill:#94a3b8} .brace{stroke:#d97706;stroke-width:1.2}
    .up-band{fill:#fffcf2;stroke:#fde68a} .up-lb{fill:#b45309} .up-lt{fill:#92400e} .up-note{fill:#b45309} .up-warn{fill:#b91c1c}
    .down-band{fill:#f5fbff;stroke:#e0f2fe} .down-lb{fill:#0369a1} .down-lt{fill:#075985} .down-m{fill:#0369a1}
    .pre{fill:#f1f5f9;stroke:#cbd5e1} .pre-t{fill:#334155} .pre-m{fill:#64748b}
    .st{fill:#fef3c7;stroke:#fbbf24} .st-t{fill:#92400e} .st-m{fill:#b45309}
    .run{fill:#dcfce7;stroke:#86efac} .run-t{fill:#166534} .run-m{fill:#15803d}
    .sig{fill:#fee2e2;stroke:#fca5a5} .sig-t{fill:#b91c1c} .sig-m{fill:#dc2626}
    .dn{fill:#e0f2fe;stroke:#7dd3fc} .dn-t{fill:#075985} .dn-m{fill:#0369a1}
    .end{fill:#dcfce7;stroke:#86efac} .end-t{fill:#166534} .end-m{fill:#15803d}
    .bud1{fill:#bae6fd} .bud1-t{fill:#075985} .bud2{fill:#fde68a} .bud2-t{fill:#92400e}
    .note{fill:#f8fafc;stroke:#e2e8f0} .note-t{fill:#334155} .note-m{fill:#475569} .dot{fill:#94a3b8}
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .title{fill:#e6edf3} .sub{fill:#9198a1} .edge{stroke:#6e7681} .arrowhead{fill:#6e7681} .brace{stroke:#d29922}
      .up-band{fill:#1a1508;stroke:#6b4e0f} .up-lb{fill:#e3b341} .up-lt{fill:#fcd34d} .up-note{fill:#e3b341} .up-warn{fill:#ff7b72}
      .down-band{fill:#0e1826;stroke:#1f3b57} .down-lb{fill:#38bdf8} .down-lt{fill:#bae6fd} .down-m{fill:#7dd3fc}
      .pre{fill:#1e293b;stroke:#475569} .pre-t{fill:#e2e8f0} .pre-m{fill:#94a3b8}
      .st{fill:#2d220a;stroke:#9a6700} .st-t{fill:#fcd34d} .st-m{fill:#e3b341}
      .run{fill:#0f2e1b;stroke:#238636} .run-t{fill:#7ee2a8} .run-m{fill:#56d364}
      .sig{fill:#3b1219;stroke:#b62324} .sig-t{fill:#ffa198} .sig-m{fill:#ff7b72}
      .dn{fill:#0b2440;stroke:#0ea5e9} .dn-t{fill:#bae6fd} .dn-m{fill:#7dd3fc}
      .end{fill:#0f2e1b;stroke:#238636} .end-t{fill:#7ee2a8} .end-m{fill:#56d364}
      .bud1{fill:#0c4a6e} .bud1-t{fill:#bae6fd} .bud2{fill:#6b4e0f} .bud2-t{fill:#fcd34d}
      .note{fill:#151b23;stroke:#30363d} .note-t{fill:#e6edf3} .note-m{fill:#b1bac4} .dot{fill:#6e7681}
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead"/></marker></defs>
  <rect width="1180" height="650" class="bg"/>
  <text x="32" y="44" font-size="25" font-weight="700" class="title">xone startup and shutdown</text>
  <text x="32" y="68" font-size="13" class="sub">Every step of xone.Run from taking over the signals to returning; shutdown mirrors startup</text>
  <rect x="32" y="92" width="1116" height="210" rx="8" class="up-band"/>
  <text x="48" y="116" font-size="11" font-weight="700" letter-spacing=".5" class="up-lb">STARTUP</text>
  <rect x="48.0" y="150" width="121.5" height="74" rx="6" class="pre"/>
  <text x="108.8" y="172" font-size="13" font-weight="700" text-anchor="middle" class="pre-t">Signals</text>
  <text x="108.8" y="190" font-size="10.5" text-anchor="middle" class="pre-m">SIGINT · SIGTERM</text>
  <text x="108.8" y="205" font-size="10.5" text-anchor="middle" class="pre-m">before config</text>
  <rect x="185.5" y="150" width="121.5" height="74" rx="6" class="pre"/>
  <text x="246.2" y="172" font-size="13" font-weight="700" text-anchor="middle" class="pre-t">Load config</text>
  <text x="246.2" y="190" font-size="10.5" text-anchor="middle" class="pre-m">on first read</text>
  <text x="246.2" y="205" font-size="10.5" text-anchor="middle" class="pre-m">error has file:line</text>
  <line x1="170.5" y1="187.0" x2="183.5" y2="187.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="323.0" y="150" width="121.5" height="74" rx="6" class="st"/>
  <text x="383.8" y="172" font-size="13" font-weight="700" text-anchor="middle" class="st-t">Log</text>
  <text x="383.8" y="190" font-size="10.5" text-anchor="middle" class="st-m">xlog · xapp</text>
  <text x="383.8" y="205" font-size="10.5" text-anchor="middle" class="st-m">xflow</text>
  <line x1="308.0" y1="187.0" x2="321.0" y2="187.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="460.5" y="150" width="121.5" height="74" rx="6" class="st"/>
  <text x="521.2" y="172" font-size="13" font-weight="700" text-anchor="middle" class="st-t">Telemetry</text>
  <text x="521.2" y="190" font-size="10.5" text-anchor="middle" class="st-m">xtrace</text>
  <text x="521.2" y="205" font-size="10.5" text-anchor="middle" class="st-m">xmetric</text>
  <line x1="445.5" y1="187.0" x2="458.5" y2="187.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="598.0" y="150" width="121.5" height="74" rx="6" class="st"/>
  <text x="658.8" y="172" font-size="13" font-weight="700" text-anchor="middle" class="st-t">Client</text>
  <text x="658.8" y="190" font-size="10.5" text-anchor="middle" class="st-m">xgorm · xredis</text>
  <text x="658.8" y="205" font-size="10.5" text-anchor="middle" class="st-m">xcache · xhttp</text>
  <line x1="583.0" y1="187.0" x2="596.0" y2="187.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="735.5" y="150" width="121.5" height="74" rx="6" class="st"/>
  <text x="796.2" y="172" font-size="13" font-weight="700" text-anchor="middle" class="st-t">Business</text>
  <text x="796.2" y="190" font-size="10.5" text-anchor="middle" class="st-m">your hooks</text>
  <text x="796.2" y="205" font-size="10.5" text-anchor="middle" class="st-m">no stage = here</text>
  <line x1="720.5" y1="187.0" x2="733.5" y2="187.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="873.0" y="150" width="121.5" height="74" rx="6" class="st"/>
  <text x="933.8" y="172" font-size="13" font-weight="700" text-anchor="middle" class="st-t">Server</text>
  <text x="933.8" y="190" font-size="10.5" text-anchor="middle" class="st-m">xgin · xecho</text>
  <text x="933.8" y="205" font-size="10.5" text-anchor="middle" class="st-m">xginswagger</text>
  <line x1="858.0" y1="187.0" x2="871.0" y2="187.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="1010.5" y="150" width="121.5" height="74" rx="6" class="run"/>
  <text x="1071.2" y="172" font-size="13" font-weight="700" text-anchor="middle" class="run-t">Runnable.Start</text>
  <text x="1071.2" y="190" font-size="10.5" text-anchor="middle" class="run-m">starts serving</text>
  <line x1="995.5" y1="187.0" x2="1008.5" y2="187.0" class="edge" marker-end="url(#arrow)"/>
  <path d="M 323.0 238 v 8 H 994.5 v -8" class="brace" fill="none"/>
  <text x="658.8" y="264" font-size="11.5" text-anchor="middle" class="up-note">Start hooks xhook.BeforeStart run in five stages in order; the framework rechecks the ctx between hooks and stops on a signal</text>
  <text x="48" y="288" font-size="11" class="up-warn">If any start hook fails → what is already up is closed in reverse and Run returns that error</text>
  <rect x="32" y="318" width="1116" height="196" rx="8" class="down-band"/>
  <text x="48" y="342" font-size="11" font-weight="700" letter-spacing=".5" class="down-lb">SHUTDOWN</text>
  <rect x="48.0" y="376" width="167.3" height="74" rx="6" class="sig"/>
  <text x="131.7" y="398" font-size="13" font-weight="700" text-anchor="middle" class="sig-t">Signal received</text>
  <text x="131.7" y="416" font-size="10.5" text-anchor="middle" class="sig-m">a second signal</text>
  <text x="131.7" y="431" font-size="10.5" text-anchor="middle" class="sig-m">kills the process</text>
  <rect x="231.3" y="376" width="167.3" height="74" rx="6" class="dn"/>
  <text x="315.0" y="398" font-size="13" font-weight="700" text-anchor="middle" class="dn-t">Cancel Start’s ctx</text>
  <text x="315.0" y="416" font-size="10.5" text-anchor="middle" class="dn-m">Runnable cleans up</text>
  <line x1="216.3" y1="413.0" x2="229.3" y2="413.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="414.7" y="376" width="167.3" height="74" rx="6" class="dn"/>
  <text x="498.3" y="398" font-size="13" font-weight="700" text-anchor="middle" class="dn-t">Runnable.Stop</text>
  <text x="498.3" y="416" font-size="10.5" text-anchor="middle" class="dn-m">optional; xgin / xecho here</text>
  <text x="498.3" y="431" font-size="10.5" text-anchor="middle" class="dn-m">waits for requests in flight</text>
  <line x1="399.7" y1="413.0" x2="412.7" y2="413.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="598.0" y="376" width="167.3" height="74" rx="6" class="dn"/>
  <text x="681.7" y="398" font-size="13" font-weight="700" text-anchor="middle" class="dn-t">Wait for Start</text>
  <text x="681.7" y="416" font-size="10.5" text-anchor="middle" class="dn-m">pools close only after</text>
  <line x1="583.0" y1="413.0" x2="596.0" y2="413.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="781.3" y="376" width="167.3" height="74" rx="6" class="dn"/>
  <text x="865.0" y="398" font-size="13" font-weight="700" text-anchor="middle" class="dn-t">Stop hooks reversed</text>
  <text x="865.0" y="416" font-size="10.5" text-anchor="middle" class="dn-m">Server → … → Log</text>
  <text x="865.0" y="431" font-size="10.5" text-anchor="middle" class="dn-m">BeforeStop</text>
  <line x1="766.3" y1="413.0" x2="779.3" y2="413.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="964.7" y="376" width="167.3" height="74" rx="6" class="end"/>
  <text x="1048.3" y="398" font-size="13" font-weight="700" text-anchor="middle" class="end-t">Run returns</text>
  <text x="1048.3" y="416" font-size="10.5" text-anchor="middle" class="end-m">xlog closes last</text>
  <line x1="949.7" y1="413.0" x2="962.7" y2="413.0" class="edge" marker-end="url(#arrow)"/>
  <rect x="231.3" y="466" width="600.4" height="22" rx="4" class="bud1"/>
  <rect x="835.8" y="466" width="296.2" height="22" rx="4" class="bud2"/>
  <text x="531.6" y="481" font-size="11" text-anchor="middle" class="bud1-t">the servers’ share: at most 2/3</text>
  <text x="983.9" y="481" font-size="11" text-anchor="middle" class="bud2-t">the rest for the stop hooks</text>
  <text x="48" y="481" font-size="11" font-weight="700" class="down-lt">One stop budget</text>
  <text x="48" y="498" font-size="10.5" class="down-m">WithStopTimeout, 15s by default</text>
  <rect x="32" y="530" width="1116" height="100" rx="8" class="note"/>
  <text x="48" y="554" font-size="13" font-weight="700" class="note-t">A few rules</text>
  <circle cx="54" cy="572" r="3" class="dot"/>
  <text x="66" y="576" font-size="11.5" class="note-m"><tspan font-weight="700">init() only registers, never initializes</tspan>: xone.Run runs the real initialization by stage, so Go’s init order does not matter; order within one stage is not to be relied on.</text>
  <circle cx="54" cy="594" r="3" class="dot"/>
  <text x="66" y="598" font-size="11.5" class="note-m"><tspan font-weight="700">Registered together means paired</tspan>: a stop hook runs only if the nearest start hook before it succeeded, and inherits its stage — it never handles “not built yet”.</text>
  <circle cx="54" cy="616" r="3" class="dot"/>
  <text x="66" y="620" font-size="11.5" class="note-m"><tspan font-weight="700">Signals are taken over from millisecond one</tspan>: before the config is read; after the first signal the default disposition returns, so a second signal can kill a stuck process.</text>
</svg>
