XApp:
  Name: xone.demo.app
  Version: v0.1.0

XLog:
  Level: info
  Format: json

XTrace:
  SampleRatio: 1
  ForwardHeaders:           # taken only from a peer in XGin.TrustedProxies, which by default trusts the private ranges only
    - X-Request-Id

XMetric:
  Namespace: demo
  ConstLabels:
    env: "${ENV:dev}"

XGin:
  Port: 8080
