XApp:
  Name: xone.demo.consumer
  Version: v0.1.0

XLog:
  Level: info
  Format: json

XMetric:
  Namespace: demo

XCache:
  MaxCost: 10000

# The business's own configuration block. What reads it is the conf.Load() in main -- a top-level
# key nobody reads keeps the process from starting at all, rather than being ignored quietly
MyApp:
  Topic: orders
  Workers: 4
  MessageTimeout: 5s
