name: release

# The release button: Actions -> release -> Run workflow, filling in the version (v0.1.0, say).
#
# A release has two steps and this button is the second:
#   1. scripts/release.sh vX.Y.Z --bump fixes up go.mod, the CHANGELOG and the install version in the
#      README, and goes into main through an ordinary PR;
#   2. press this button: tag every module on main's latest commit (v0.1.0, xgin/v0.1.0 and so on)
#      and push.
# The tags go on main and main's branch protection applies as usual: only tags are pushed here, no
# branch.
#
# What the button does:
#   - release.sh --tag: confirms that go.mod is pinned to this version, that the CHANGELOG has this
#     section and that the tags are unused, runs the checks and the unit tests, and tags locally;
#   - e2e (real PG / MySQL / Redis / ClickHouse, as in e2e.yml);
#   - release.sh --smoke: the same external project and the same checks as --verify, with the
#     dependencies pointing at the local code;
#   - pushes this one set of tags (--atomic: either all of them go up or none of them does);
#   - release.sh --verify (a job of its own): go get in a brand new external project, verifying that
#     it installs and runs.
# Nothing is pushed if any earlier step goes red. Once a tag is pushed it is cached forever by Go's
# module proxy and cannot be removed.
#
# verify is a job of its own so that it can be re-run when it goes red: a failure after the push
# (most often the proxy not having fetched the new tag yet) is re-run alone with "Re-run failed
# jobs". In the same job as the tagging, a re-run would start from the top, and the tags fetched back
# down would stop release.sh --tag at its first step -- by which time the version has long been
# released.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version, vX.Y.Z (v0 / v1 only)'
        required: true
        type: string

# One release at a time
concurrency:
  group: release
  cancel-in-progress: false

# Read-only by default; only the release job writes (pushing the tags)
permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # pushing the tags
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The same service containers as e2e.yml, with the accounts and passwords matching the defaults
    # of e2e/compose.yml and e2e/harness
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: xone
          POSTGRES_PASSWORD: e2e-secret-pw
          POSTGRES_DB: xone_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U xone -d xone_e2e"
          --health-interval 2s --health-retries 30
      mysql:
        image: mirror.gcr.io/library/mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e-root-pw
          MYSQL_USER: xone
          MYSQL_PASSWORD: e2e-secret-pw
          MYSQL_DATABASE: xone_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uxone -pe2e-secret-pw"
          --health-interval 2s --health-retries 60
      redis:
        image: mirror.gcr.io/library/redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-retries 30
      clickhouse:
        image: mirror.gcr.io/clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: xone
          CLICKHOUSE_PASSWORD: e2e-secret-pw
          CLICKHOUSE_DB: xone_e2e
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports: ['9000:9000', '8123:8123']
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 2s --health-retries 60
      kafka:
        image: mirror.gcr.io/apache/kafka:3.9.1
        env:
          KAFKA_NODE_ID: '1'
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
        ports: ['9092:9092']
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092"
          --health-interval 3s --health-retries 40
    env:
      # The version reaches the script through an environment variable rather than being pasted into
      # run: what somebody types into the input box must never get a chance to become a command
      VERSION: ${{ inputs.version }}
      XONE_E2E_EXTERNAL: '1'
      XONE_E2E_PG_ADDR: 127.0.0.1:5432
      XONE_E2E_MYSQL_ADDR: 127.0.0.1:3306
      XONE_E2E_REDIS_ADDR: 127.0.0.1:6379
      XONE_E2E_CH_ADDR: 127.0.0.1:9000
      XONE_E2E_CH_HTTP_ADDR: 127.0.0.1:8123
      XONE_E2E_KAFKA_ADDR: 127.0.0.1:9092
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release.sh looks at whether this version's tags already exist
          # No token that can write to the repository is left in .git/config: the checks, the unit
          # tests and e2e that follow run the repository's and the dependencies' code and have no use
          # for it. The token is handed only to the push and the summary, through an environment
          # variable, never to disk
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: release.sh --tag (confirm it can be released, check, unit-test, tag locally)
        run: scripts/release.sh "$VERSION" --tag --e2e-passed

      # The three skipped are the same as in e2e.yml: the PG / MySQL / Redis TLS cases need root to
      # start a local instance, and the runner is not root.
      # The step above was given --e2e-passed, which this step makes good on: if this goes red the
      # tags stay on this machine and are never pushed
      - name: e2e
        run: scripts/e2e.sh -skip 'TestTLS_(PostgreSQL|MySQL|Redis)$'

      # The same external project and the same checks as the --verify after the push, with the
      # dependencies pointing at this tagged commit locally.
      # --verify once went red only after the tags had been pushed; when this step goes red the tags
      # are still on this machine alone
      - name: release.sh --smoke (before the push, an external project on the local code starts and stops correctly)
        run: scripts/release.sh "$VERSION" --smoke

      # A PAT rather than github.token: the org has disabled GITHUB_TOKEN's write permission (it
      # cannot be changed at the repository level, and the API answers 409 Write permissions for
      # workflows are disabled by the organization), and a read-only token cannot push a ref.
      # RELEASE_TOKEN is a fine-grained PAT with contents:write on this repository alone
      - name: push the tags
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "✗ the repository secret RELEASE_TOKEN is not set: pushing tags needs a fine-grained PAT with contents:write on this repository"; exit 1; }
          refs=$(git tag --points-at "$VERSION" | sed 's|^|refs/tags/|')
          echo "$refs"
          git push --atomic "https://x-access-token:$TOKEN@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git" $refs

      # Whether anything was pushed is decided by the remote, not locally: a local tag only says it
      # was created, and if an earlier step went red it never left this runner.
      # The push step's own exit code is not enough either: a connection dropping after the server
      # took it leaves the push red while the tags are already up
      - name: summary
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          local_tags=$(git tag --list "$VERSION" "*/$VERSION" | tr '\n' ' ')
          {
            echo "### release $VERSION"
            echo
            if ! remote=$(git ls-remote --tags --refs "https://x-access-token:$TOKEN@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git" "$VERSION"); then
              echo "⚠ the remote tags could not be listed (git ls-remote failed); whether anything was pushed is in the \"push the tags\" step. Tagged locally: ${local_tags:-none}"
            elif [ -n "$remote" ]; then
              echo "already on the remote (pushed): $(echo "$remote" | sed 's|.*refs/tags/||' | tr '\n' ' ')"
            elif [ -n "$local_tags" ]; then
              echo "tagged locally, not pushed: $local_tags"
              echo
              echo "These tags are discarded along with this runner; fix the problem and press the release button again."
            else
              echo "Nothing was tagged and nothing was pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The verification after the push is a job of its own: when it goes red, "Re-run failed jobs"
  # re-runs this alone (see the top of this file).
  # It only reads the scripts on main and fetches the released version from the module proxy, needing
  # neither write permission nor the tags
  verify:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: release.sh --verify (an external project installs it and runs)
        run: scripts/release.sh "$VERSION" --verify

      - name: summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### verify $VERSION"
            echo
            if [ "$STATUS" = success ]; then
              echo "✓ an external project go-gets it and runs."
            else
              echo "✗ --verify did not pass. The tags are already pushed: if the proxy has not fetched the new version yet, press \"Re-run failed jobs\" in a few minutes to re-run this job alone;"
              echo "if there really is a regression, this version cannot be withdrawn -- fix it and release the next one."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
