name: e2e

# Tests against real services (scripts/e2e.sh, no load test). Far slower than CI, so not every PR
# runs it:
#   - a PR touching any go.mod / go.sum: upgrading a dependency is exactly when "a default changed
#     and nobody knew";
#   - once a night, along with the full mutation testing;
#   - triggered by hand (with the mutation testing as well).
on:
  pull_request:
    paths: ['**/go.mod', '**/go.sum']
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: not one step here writes to the repository, and a token with more than that lets
# whatever is in the code under test or in a dependency write with it
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The accounts, passwords and database names match the defaults of e2e/compose.yml and
    # e2e/harness.
    # The images come from mirror.gcr.io (Docker Hub's public image cache); the ClickHouse TLS cases
    # start another container from the same image.
    # The Kafka settings match e2e/compose.yml (a single KRaft node)
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_USER: xone
          POSTGRES_PASSWORD: e2e-secret-pw
          POSTGRES_DB: xone_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U xone -d xone_e2e"
          --health-interval 2s --health-retries 30
      mysql:
        image: mirror.gcr.io/library/mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: e2e-root-pw
          MYSQL_USER: xone
          MYSQL_PASSWORD: e2e-secret-pw
          MYSQL_DATABASE: xone_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uxone -pe2e-secret-pw"
          --health-interval 2s --health-retries 60
      redis:
        image: mirror.gcr.io/library/redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-retries 30
      clickhouse:
        image: mirror.gcr.io/clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: xone
          CLICKHOUSE_PASSWORD: e2e-secret-pw
          CLICKHOUSE_DB: xone_e2e
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports: ['9000:9000', '8123:8123']
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 2s --health-retries 60
      kafka:
        image: mirror.gcr.io/apache/kafka:3.9.1
        env:
          KAFKA_NODE_ID: '1'
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
        ports: ['9092:9092']
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092"
          --health-interval 3s --health-retries 40
    env:
      # The services are taken care of by the containers above: e2e.sh only waits for them to be
      # ready and never runs pg_ctlcluster / service mysql start
      XONE_E2E_EXTERNAL: '1'
      XONE_E2E_PG_ADDR: 127.0.0.1:5432
      XONE_E2E_MYSQL_ADDR: 127.0.0.1:3306
      XONE_E2E_REDIS_ADDR: 127.0.0.1:6379
      XONE_E2E_CH_ADDR: 127.0.0.1:9000
      XONE_E2E_CH_HTTP_ADDR: 127.0.0.1:8123
      XONE_E2E_KAFKA_ADDR: 127.0.0.1:9092
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: '**/go.sum'

      # The PG / MySQL / Redis TLS cases are skipped: they use the host's initdb / mysqld /
      # redis-server to start an instance of their own in a temporary directory that accepts TLS
      # only, whose files have to be chowned to the postgres / mysql system accounts, which requires
      # root; the runner is not root, and mysqld is additionally confined to /var/lib/mysql by
      # AppArmor.
      # Those three do run when scripts/e2e.sh is run locally; the xgin / xhttp / ClickHouse TLS
      # cases run here as usual.
      # pipefail comes only with shell: bash spelled out: the default bash -e goes by tee's exit code
      # alone, so this step stays green even when the tests go red
      - name: scripts/e2e.sh
        shell: bash
        run: scripts/e2e.sh -skip 'TestTLS_(PostgreSQL|MySQL|Redis)$' 2>&1 | tee e2e.log

      # KNOWN BUG: a framework bug the tests revealed and nobody has fixed yet, printed with its
      # reason and skipped (see e2e/doc.go). A skip does not turn the job red, so the count goes into
      # the job summary where it is visible at a glance
      - name: summary
        if: always()
        run: |
          [ -f e2e.log ] || exit 0
          bugs=$(grep -c 'KNOWN BUG: ' e2e.log || true)
          {
            echo "### e2e"
            echo
            echo "| pass | fail | skip | KNOWN BUG |"
            echo "|---:|---:|---:|---:|"
            echo "| $(grep -cE '^ *--- PASS' e2e.log) | $(grep -cE '^ *--- FAIL' e2e.log) | $(grep -cE '^ *--- SKIP' e2e.log) | **$bugs** |"
            if [ "$bugs" -gt 0 ]; then
              echo
              grep -oE 'KNOWN BUG: .*' e2e.log | sed 's/^/- /'
            fi
            if grep -q 'ClickHouse is unavailable' e2e.log; then
              echo
              echo "⚠ ClickHouse was unavailable and every CH case was skipped"
            fi
            if grep -q 'Kafka is unavailable' e2e.log; then
              echo
              echo "⚠ Kafka was unavailable and every Kafka case was skipped"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The full mutation testing: break every promise and see whether a test fails (scripts/mutate.py).
  # It needs no database and runs the unit tests alone; it runs nightly and when triggered by hand,
  # never on a PR
  mutate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: '**/go.sum'
      - run: scripts/mutate.py
