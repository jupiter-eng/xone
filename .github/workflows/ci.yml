name: CI

on:
  push:
    branches: [main]
  pull_request:

# A PR with a new commit pushed makes the run still going pointless; every commit on main runs to
# completion
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: not one step here writes to the repository, and a token with more than that lets
# whatever is in the code under test or in a dependency write with it
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # As in the release flow (release.yml), switching toolchains automatically is not allowed:
    # otherwise, once go.work / go.mod is raised to a higher go version, this quietly downloads the
    # new toolchain and passes all the same, only to go red at the release button (which is exactly
    # how the first release of v1.24.0 failed)
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          # The highest of the modules' floors. The core itself needs only 1.23, while the
          # integrations need 1.25 because of their upstreams, and CI has to run all of them
          go-version: '1.25'
          # Each module has a go.sum of its own, and the cache key has to take them all in
          cache: true
          cache-dependency-path: '**/go.sum'

      # The design constraint checks; what they are is in scripts/check.sh
      - run: scripts/check.sh

      - run: scripts/test.sh -count=1

  # The core's floor is verified separately: check.sh runs on a machine with a newer toolchain
  # installed and does not say whether the core still really compiles with 1.23
  core-go-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: go.sum
      - run: GOTOOLCHAIN=local GOWORK=off go build ./...
      - run: GOTOOLCHAIN=local GOWORK=off go vet ./...
