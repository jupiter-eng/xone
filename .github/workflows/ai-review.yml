# AI code review (open-code-review + OpenRouter). Advisory only, not a required check.
# The model comes from org variable OCR_MODEL; change it there to switch every repo.
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Draft, Dependabot and fork PRs don't get org secrets, so skip them.
    if: >-
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: alibaba/open-code-review@1672852136fc87748249d22bce0819f33419ea79 # v1.13.0
        with:
          llm_url: https://openrouter.ai/api/v1
          llm_auth_token: ${{ secrets.OPENROUTER_API_KEY }}
          llm_model: ${{ vars.OCR_MODEL }}
          llm_use_anthropic: 'false'
          llm_extra_body: '{"reasoning": {"enabled": false}}'
          ocr_version: 1.13.0
          sticky_summary: 'true'
          incremental: 'true'
          checkpoint_range: 'true'
